groups:
  - name: orderflow_alerts
    rules:
      - alert: HighErrorRate
        expr: (sum(rate(http_errors_total[2m])) or sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[2m]))) / (sum(rate(http_requests_total[2m])) or sum(rate(http_server_request_duration_seconds_count[2m]))) > 0.05
        for: 2m
        labels:
          severity: critical
          application: OrderFlow.Api
        annotations:
          summary: "High HTTP Error Rate (> 5%)"
          description: "HTTP 5xx and failure error rate is at {{ $value | humanizePercentage }} over the last 2 minutes, exceeding the 5% threshold."

      - alert: HighPendingOrders
        expr: sum(pending_orders_count) > 50
        for: 5m
        labels:
          severity: warning
          application: OrderFlow.Infrastructure
        annotations:
          summary: "Pending Orders Backlog Threshold Exceeded (> 50 orders)"
          description: "Pending orders count has exceeded 50 orders for more than 5 minutes (current value: {{ $value }}), indicating background processor delay or failure."
